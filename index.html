<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Solar Blaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/hub.css" />
</head>
<body>
  <main class="hub">
    <p class="hub-eyebrow">SOLAR BLASTER</p>
    <h1 class="hub-title">Choose a version</h1>
    <p class="hub-sub">V1 and V2 keep separate saves. Pick one and play.</p>

    <div class="hub-cards">
      <a class="hub-card hub-card--v1" href="v1/">
        <span class="hub-card-ver">V1</span>
        <span class="hub-card-name">Neon Outward</span>
        <span class="hub-card-desc">Mercury → Neptune. Neon skins, classic high score, outward campaign.</span>
      </a>
      <a class="hub-card hub-card--v2" href="v2/">
        <span class="hub-card-ver">V2</span>
        <span class="hub-card-name">Stencil Riso</span>
        <span class="hub-card-desc">Neptune → Sun. Magazines, three-phase levels, Stencil Riso look.</span>
      </a>
    </div>
  </main>
</body>
</html>
